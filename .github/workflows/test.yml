name: Test

on:
  pull_request:
    paths:
      - 'ituob/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'messages/**'
      - 'ob-issues/**'
      - 'Gemfile'
      - 'scripts/generate_data_schemas.rb'
  push:
    branches: [ main ]
    paths:
      - 'ituob/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'scripts/generate_data_schemas.rb'

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    # The gem bundle (ituob/Gemfile + lock): moxml/leptris XML stack,
    # no metanorma chain, serialization-certified versions pinned.
    - name: Install the gem bundle
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle install

    # The LML ontology is the single source of the register data
    # schemas: regenerate datasets/*/schema-data.yaml and fail when the
    # committed copy differs from a fresh generation.
    - name: Check generated data schemas are in sync with the LML
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: |
        bundle exec ruby scripts/generate_data_schemas.rb
        git diff --exit-code -- datasets

    - name: Run the ituob gem suite
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec rspec ituob/spec/

    # 645 examples: model/normalizer/verifier behavior, the LML
    # ontology drift guard and the compiled-class wiring.
