name: Test

on:
  pull_request:
    paths:
      - 'ituob/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'messages/**'
      - 'ob-issues/**'
      - 'Gemfile'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'ituob/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  authored-patch-tests:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ituob/Gemfile
      AUTHORED_PATCH_RUBY_TESTS: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Install the service gem bundle
      run: bundle install

    # The F.32 content tests read the official PDFs with pdftotext.
    - name: Run authored data Python and Ruby tests
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils
        python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  rspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    # The gem bundle (ituob/Gemfile + lock): moxml/leptris XML stack,
    # no metanorma chain, serialization-certified versions pinned.
    - name: Install the gem bundle
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle install

    # The LML ontology is the single source of the register data
    # schemas: regenerate datasets/*/schema-data.yaml and fail when the
    # committed copy differs from a fresh generation.
    - name: Check generated data schemas are in sync with the LML
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ruby scripts/generate_data_schemas.rb --verify

    - name: Validate every dataset seed through its LML Entry class
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ruby scripts/validate_data_lml.rb --datasets-only

    - name: Run the ituob gem suite
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils
        bundle exec rspec ituob/spec/

    # 645 examples: model/normalizer/verifier behavior, the LML
    # ontology drift guard and the compiled-class wiring.
