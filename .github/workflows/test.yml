name: Test

on:
  pull_request:
    paths:
      - 'ituob/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'messages/**'
      - 'ob-issues/**'
      - 'Gemfile'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'ituob/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  authored-patch-tests:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ituob/Gemfile
      AUTHORED_PATCH_RUBY_TESTS: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Install the service gem bundle
      run: bundle install

    - name: Run authored data Python and Ruby tests
      run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  rspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    # The gem bundle (ituob/Gemfile + lock): moxml/leptris XML stack,
    # no metanorma chain, serialization-certified versions pinned.
    - name: Install the gem bundle
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle install

    - name: Run the ituob gem suite
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec rspec ituob/spec/

    # 645 examples: model/normalizer/verifier behavior, the LML
    # ontology drift guard and the compiled-class wiring.
