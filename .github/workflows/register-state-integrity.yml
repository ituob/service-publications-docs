name: Register State Integrity

on:
  pull_request:
    paths:
      - 'datasets/**'
      - 'catalogs/**'
      - 'ob-issues/**'
      - 'datasets.yaml'
      - 'ituob/**'
      - 'scripts/check_register_state_integrity.rb'
      - 'scripts/generate_register_snapshots.rb'
      - 'scripts/register_state_integrity_allowlist.jsonl'
      - '.github/workflows/register-state-integrity.yml'
  push:
    branches: [ main ]
    paths:
      - 'datasets/**'
      - 'catalogs/**'
      - 'ob-issues/**'
      - 'datasets.yaml'
      - 'ituob/**'
      - 'scripts/check_register_state_integrity.rb'
      - 'scripts/generate_register_snapshots.rb'
      - 'scripts/register_state_integrity_allowlist.jsonl'
      - '.github/workflows/register-state-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Install the gem bundle
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle install

    # Reads catalogs/, datasets/ and ob-issues/ from this checkout
    # (Ituob::DataRoot); the itu-ob-data submodule is not needed.
    - name: Generate register snapshots
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
        SNAPSHOTS_OUT: ${{ runner.temp }}/register-snapshots
      run: bundle exec ruby scripts/generate_register_snapshots.rb

    - name: Check register state integrity
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ruby scripts/check_register_state_integrity.rb --snapshots-root "${{ runner.temp }}/register-snapshots"
