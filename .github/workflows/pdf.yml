name: pdf

# Renders every service publication x language to PDF (spd#89, ituob.github.io#106)
# and uploads the one `publications` artifact the site fetches: manifest.json at
# its root and the PDFs at the paths the manifest names. Restricted manual runs
# upload `publications-subset`, which the site never selects as its catalog.
#
# One shard per publication (documents/T-SP-*), so a slow or broken
# publication cannot hide the others; each shard runs
# scripts/render_publications.rb --strict and keeps its own manifest and
# render-failures.log. The `publications` job merges the shards
# (scripts/merge_publication_manifests.rb) and fails when any shard
# logged a failure, so a run that fails never reaches the site.
#
# This workflow only builds and uploads. It never deploys, uses no secrets
# and restores no cache, so a pull request from a fork cannot poison
# anything another workflow later trusts.
on:
  pull_request:
    paths: &paths
      - 'documents/**'
      - 'datasets/**'
      - 'catalogs/**'
      - 'metanorma.yml'
      - 'scripts/render_publications.rb'
      - 'scripts/build_pdf_coverage_matrix.rb'
      - 'scripts/merge_publication_manifests.rb'
      - 'scripts/pdf_typesetting_report.rb'
      - 'scripts/patch_itu_cjk_font_fallback.rb'
      - 'scripts/patch_itu_f32_tables.rb'
      - 'docs/pdf/typesetting-baselines.json'
      - 'scripts/check_official_pdfs.rb'
      - 'scripts/check_f32_content.py'
      - 'scripts/pdf_fidelity_report.rb'
      - 'docs/pdf/official*'
      - 'docs/pdf/official/**'
      - 'ituob/spec/fixtures/f32/official-2011.pdf'
      - 'ituob/spec/fixtures/f32/printed-content.json'
      - 'ituob/spec/scripts/check_official_pdfs_spec.rb'
      - 'ituob/spec/scripts/pdf_fidelity_report_spec.rb'
      - 'ituob/lib/**'
      - 'ituob/ituob.gemspec'
      - 'scripts/prepare_metanorma_provider.rb'
      - '.github/workflows/pdf.yml'
    # The site fetches only push/workflow_dispatch runs on main, so the PDFs
    # reach ituob.org only from this trigger.
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      docs:
        description: 'Comma-separated publications to render (default: all), e.g. T-SP-F.32-2011'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "pdf-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.list.outputs.docs }}
      count: ${{ steps.list.outputs.count }}
      artifact-name: ${{ steps.list.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        env:
          ONLY: ${{ github.event.inputs.docs }}
        run: |
          set -eu
          docs=$(ls -d documents/T-SP-* | xargs -n1 basename | jq -R . | jq -sc .)
          artifact_name=publications
          # A restricted run can merge successfully without covering the catalog.
          # Reserve the site artifact name for unrestricted runs only.
          if [ -n "${ONLY:-}" ]; then
            artifact_name=publications-subset
            docs=$(echo "$docs" | jq -c --arg only "$ONLY" '($only | split(",")) as $o | map(select(. as $d | $o | index($d)))')
          fi
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$docs" | jq length)" >> "$GITHUB_OUTPUT"
          echo "$docs"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        doc: ${{ fromJSON(needs.plan.outputs.docs) }}
    container:
      image: metanorma/metanorma:latest
    env:
      DOC_ID: ${{ matrix.doc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Metanorma data provider
        run: |
          METANORMA_GEMFILE="${BUNDLE_GEMFILE:-/setup/Gemfile}" \
          env -u RUBYOPT -u BUNDLE_GEMFILE ruby scripts/prepare_metanorma_provider.rb

      # The image embeds only Noto Sans/Serif and Arial, so Chinese prints as `#`
      # and Arabic loses glyphs. The A and C sources name their font in a
      # `:fonts:` header attribute (itu.service-publication.xsl adds it to the
      # font stack); install it here so the render can find it. A failed
      # install fails the shard rather than rendering `#` silently.
      - name: Install the Chinese and Arabic fonts
        run: |
          set -eu
          if ls "documents/$DOC_ID"/*-C.adoc >/dev/null 2>&1; then
            # The fontist formula can select NotoSansSC[wght].ttf even when
            # static fonts are requested; mn2pdf explicitly skips that file.
            # Register the release's standalone Regular and Bold OTFs instead.
            font_dir="${FONTIST_PATH:?}/fonts/noto_sans_sc_static"
            mkdir -p "$font_dir"
            for weight in Regular Bold; do
              curl --fail --location --retry 3 \
                "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/SubsetOTF/SC/NotoSansSC-$weight.otf" \
                --output "$font_dir/NotoSansSC-$weight.otf"
            done
            ruby -rfontist -e '
              Fontist::Indexes::FontistIndex.instance.rebuild
              fonts = Fontist::Manifest.from_hash({"Noto Sans SC" => ["Regular", "Bold"]}, locations: true).to_hash
              paths = fonts.fetch("Noto Sans SC").values.flat_map { |style| style.fetch("paths") }
              abort "Chinese static fonts not registered" unless paths.size >= 2 && paths.all? { |path| path.end_with?(".otf") }
              puts paths
            '
            # The service-publication stylesheet overrides :fonts: with Arial
            # on page sequences and tables. Add the installed Chinese fallback.
            ruby scripts/patch_itu_cjk_font_fallback.rb
          fi
          if ls "documents/$DOC_ID"/*-A.adoc >/dev/null 2>&1; then
            fontist install "Noto Naskh Arabic" --accept-all-licenses
          fi

      - name: Match F.32 table typography to the official edition
        if: matrix.doc == 'T-SP-F.32-2011'
        # Each publication has its own container: this cannot change other shards.
        run: ruby scripts/patch_itu_f32_tables.rb

      # Renders with `metanorma -t itu -x pdf --agree-to-terms` per language,
      # copies each PDF to build/pdf/<standard>-<year>/ and writes
      # build/pdf/manifest.json. The PDFs also stay beside their sources for
      # the checks below.
      - name: Build the PDFs and the manifest
        run: |
          set -eu
          # The script runs on the image's gems via plain rubygems (no bundler
          # env) with ituob/lib on the load path; the metanorma it starts gets
          # the image's original env back.
          RENDER_ORIG_RUBYOPT="${RUBYOPT-}" RENDER_ORIG_BUNDLE_GEMFILE="${BUNDLE_GEMFILE-}" \
          env -u RUBYOPT -u BUNDLE_GEMFILE ruby -I ituob/lib scripts/render_publications.rb \
            --docs "$DOC_ID" --out-dir build --strict
          cat build/pdf/manifest.json

      - name: Check the PDFs exist and are not empty
        run: |
          set -eu
          for pdf in "documents/$DOC_ID"/*.pdf; do
            test -s "$pdf"
            ls -l "$pdf"
          done

      # A PDF built from an empty dataset is still a valid, non-empty file
      # (metanorma exits 0), so the pilot also checks the rendered content:
      # every dataset row must appear in the document metanorma built the PDF from.
      - name: Check the pilot PDFs contain the dataset rows
        if: matrix.doc == 'T-SP-PP.RES.21-2011'
        env:
          DATA: datasets/991-PP.RES.21.pp/data.yaml
          DOC_DIR: documents/T-SP-PP.RES.21-2011
        run: |
          set -eu
          for lang in E F S; do
            ruby -ryaml -e '
              lang = { "E" => "en", "F" => "fr", "S" => "es" }.fetch(ARGV[1])
              rows = YAML.safe_load_file(ARGV[0])
              abort "dataset #{ARGV[0]} has no rows" if rows.nil? || rows.empty?
              text = File.read(ARGV[2]).gsub(/<[^>]+>/, " ")
              missing = rows.map { |r| r["geographic_area"][lang] }
                            .reject { |name| text.include?(name) }
              abort "#{ARGV[2]}: #{missing.size} of #{rows.size} rows missing, e.g. #{missing.first(3).inspect}" unless missing.empty?
              puts "#{ARGV[2]}: all #{rows.size} rows present"
            ' "$DATA" "$lang" "$DOC_DIR/$DOC_ID-$lang.presentation.xml"
          done

      - name: Upload this publication's PDFs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.doc }}
          path: |
            build/pdf/
            build/render-failures.log
          if-no-files-found: error

  official-comparison:
    needs: [plan, render]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install PDF text extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: parts

      - name: Compare every selected row with its official PDF
        env:
          DOCS: ${{ needs.plan.outputs.docs }}
        run: |
          ruby scripts/check_official_pdfs.rb --generated parts \
            --docs "$(echo "$DOCS" | jq -r 'join(",")')" \
            --out build/official-comparison

      - name: Preserve F.32 printed notes and country order in all three languages
        if: ${{ !cancelled() && contains(fromJSON(needs.plan.outputs.docs), 'T-SP-F.32-2011') }}
        run: python3 scripts/check_f32_content.py --generated parts

      - name: Write the per-row score table to the job summary
        if: always()
        run: |
          if [ -f build/official-comparison/scores.md ]; then
            cat build/official-comparison/scores.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Official PDF comparison did not produce a report. See failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload official PDF scores and candidate baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-pdf-comparison
          path: build/official-comparison/
          if-no-files-found: error

  typesetting:
    needs: [plan, publications]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ituob/Gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          bundle install
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: rendered
      # Advisory until the documented typesetting failures are resolved.
      # Keep --verify so the step and JSON retain an honest failure verdict.
      - name: Report typesetting fidelity
        id: report
        continue-on-error: true
        run: bundle exec ruby scripts/pdf_typesetting_report.rb --pdf-dir rendered --out-dir typesetting --verify
      - name: Upload typesetting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typesetting-report
          path: typesetting/
          if-no-files-found: error

  publications:
    needs: [plan, render]
    # Runs even when a shard failed, to say which; it then fails itself.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: parts

      - name: Merge the shards into one manifest
        run: |
          set -eu
          ruby scripts/merge_publication_manifests.rb --parts parts --out publications \
            --expect "${{ needs.plan.outputs.count }}"
          jq '.publications | length' publications/manifest.json
          du -sh publications

      - name: Upload the publications artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: publications/
          if-no-files-found: error
