name: Validate OB Issues

on:
  pull_request:
    paths:
      - 'datasets/**'
      - 'ob-issues/**'
      - 'scripts/validate_references.rb'
      - 'scripts/build_ob_issues.rb'
  push:
    branches: [ main ]
    paths:
      - 'datasets/**'
      - 'ob-issues/**'
      - 'scripts/validate_references.rb'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    # The gem bundle (ituob/Gemfile + lock) is the moxml/leptris XML
    # stack — it does not include the metanorma document chain, so no
    # native libxslt headers are needed. The committed lock pins the
    # serialization-certified gem versions.
    - name: Install the gem bundle
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle install

    - name: Validate dataset shapes
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ituob dataset validate

    - name: Cross-reference validation
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ruby scripts/validate_references.rb

    - name: Parser equivalence against baselines
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ruby scripts/verify_parser_equivalence.rb --verify

    - name: Instance-data validation against the LML ontology
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: bundle exec ruby scripts/validate_data_lml.rb --all
