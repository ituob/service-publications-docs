# Human dispositions for scripts/compare_official_pdf.rb: T-SP-E.212A-2017-E, generated PDF (89-gen run, group G2)
# against the official ITU PDF. Settles only the open (bug or unreviewed) deltas by rules checked on
# samples (see README-g2.adoc); data and layout deltas the tool settles itself are not listed.
- layer: rows
  side: official_only
  text: alpha:612 Côte d'Ivoire (Republic of)
  disposition: bug
  reason: The generated alphabetical list is sorted by code point (capitals before
    lower case, accented letters after z), so this row is out of alphabetical order;
    the official PDF sorts ignoring case and accents (the row sits between alphabetical
    neighbours there).
