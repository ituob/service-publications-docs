# Human dispositions for scripts/compare_official_pdf.rb on the F.32 2011 pilot
# (docs/pdf/comparison-pilot.adoc). Each entry settles the open (bug or
# unreviewed) deltas whose layer, side and exact text it names; `count` is how
# many such deltas it must match (default 1). The tool fails on an entry that
# matches a different number, so a stale entry cannot hide a change.
- layer: rows
  side: both
  text: 'URFS: generated "Radio/KFS Palo Alto, California Radio/KFS" vs official "MCI/WUI"'
  disposition: layout
  reason: The official layout prints the network cell (MCI/WUI) on the code's line, so pdftotext reads it as the name; the dataset name is Palo Alto, California Radio/KFS on both sides.
- layer: rows
  side: both
  text: 'UTFS: generated "Radio/KFS Palo Alto, California Radio/KFS" vs official "TRT/FTC MCI/WUI"'
  disposition: layout
  reason: Network cell (TRT/FTC) printed on the code's line in the official PDF; same name as the generated row.
- layer: rows
  side: both
  text: 'URMO: generated "Radio Mobile, Alabama Radio" vs official "AT&T MCI/WUI"'
  disposition: layout
  reason: Network cell (MCI/WUI) printed on the code's line in the official PDF; same name as the generated row.
- layer: rows
  side: both
  text: 'UJMR: generated "Radio Mobile, Alabama Radio" vs official "MMR"'
  disposition: layout
  reason: Network cell (MMR) printed on the code's line in the official PDF; same name as the generated row.
- layer: rows
  side: both
  text: 'UTMR: generated "Radio Mobile, Alabama Radio" vs official "TRT/FTC"'
  disposition: layout
  reason: Network cell (TRT/FTC) printed on the code's line in the official PDF; same name as the generated row.
- layer: rows
  side: both
  text: 'DJXX: generated "All destinations" vs official "Diego García All destinations"'
  disposition: layout
  reason: >-
    The official PDF has a code-less row above DJXX (DIEGO GARCÍA, network code
    DG, office name "Diego García", no office code); its name cell sits in the
    wrap lines above the DJXX row, so the tool reads it as part of the DJXX
    name. DJXX is "All destinations" on both sides.
- layer: rows
  side: both
  text: 'UNAX: generated "ALEXANDRIE ALEXANDRIE CENTRE" vs official "ALEXANDRIA CENTRE / ALEXANDRIE CENTRE"'
  disposition: data
  reason: >-
    The dataset names UNAX only "ALEXANDRIE CENTRE" (en, fr and es,
    datasets/980-F.32/data.yaml), so the generated PDF cannot print the
    official first line "ALEXANDRIA CENTRE /". The first pilot's wrap rule
    hid this as layout.
- layer: rows
  side: official_only
  text: '--SX All others'
  count: 2
  disposition: data
  reason: >-
    Puerto Rico and Yemen. The code --SX is reused, so the dataset lookup
    cannot settle it; neither country is in datasets/980-F.32/data.yaml (it
    ends at Israel), so the generated PDF cannot contain either row.
- layer: prose
  side: both
  text: 'generated "LIST OF TELEGRAM" vs official ""'
  disposition: layout
  reason: The generated page 2 repeats the running title "LIST OF TELEGRAM DESTINATION INDICATORS" (page furniture, not preface text).
- layer: prose
  side: both
  text: 'generated "Destination Indicators" vs official ""'
  disposition: layout
  reason: The generated page 2 repeats the "1. Destination Indicators" title block before the first table; the official PDF has it on a different page.
