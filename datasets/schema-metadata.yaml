---
$schema: https://json-schema.org/draft/2020-12/schema
title: ITU Operational Bulletin Document Metadata
description: Schema for metadata of ITU Operational Bulletin service publications
type: object
required:
  - title
properties:
  $schema:
    type: string
    description: The schema file for this metadata
  title:
    type: object
    description: The title of the document in multiple languages
    required:
      - en
    properties:
      en:
        type: string
        description: English title
      fr:
        type: string
        description: French title
      es:
        type: string
        description: Spanish title
  recommendation:
    type: object
    description: The ITU Recommendation this dataset's publication belongs to
    required:
      - code
    properties:
      body:
        type: string
        description: Issuing body (ITU-T, ITU-R)
      code:
        type: string
        description: Recommendation code (e.g. F.170, E.118)
      version:
        type: string
        description: Version/date of the referenced edition
  url:
    type: string
    description: Authoritative external resource for this publication
  source:
    type: string
    description: Source file within service-publications-data
  note:
    type: object
    description: Editorial note about this dataset
    required:
      - en
    properties:
      en:
        type: string
      fr:
        type: string
      es:
        type: string
  external:
    type: boolean
    description: True when the publication is maintained outside the OB pipeline
  alias_of:
    type: string
    description: Canonical dataset this directory aliases
  locale:
    type: array
    description: Localized terms used in the document
    items:
      type: object
      required:
        - key
        - en
      properties:
        key:
          type: string
          description: The term identifier
        en:
          type: string
          description: English translation
        fr:
          type: string
          description: French translation
        es:
          type: string
          description: Spanish translation
additionalProperties: false
