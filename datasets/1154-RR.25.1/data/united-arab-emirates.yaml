# yaml-language-server: $schema=../schema-data.yaml
---
#United Arab Emirates
#Amateur stations: A61 followed by a group of not more than 3 letters
#Experimental stations: A62 followed by a group of not more than 3 letters

groups:
  amateur:
  - regex: A61[:upper:]{1,3}
    description: "A61 followed by a group of not more than 3 letters"

  experimental:
  - regex: A62[:upper:]{1,3}
    description: "A62 followed by a group of not more than 3 letters"
