---
- groups:
    amateur:
    - regex: 7X(02-5)[A-Z]{2,3}
      criteria:
      - segment_type: string
        key: '1'
        value: 7X
      - key: '2'
        segment_type: enum
        values:
        - segment_type: string
          value: '0'
        - segment_type: range
          range:
            from: '2'
            to: '5'
      - key: '3'
        segment_type: range
        range:
          from: A
          to: Z
          cardinality: 2-3
    experimental:
    - regex: 7X(6-7)[A-Z]{2,3}
      criteria:
      - segment_type: string
        key: '1'
        value: 7X
      - key: '2'
        segment_type: range
        range:
          from: '6'
          to: '7'
      - key: '3'
        segment_type: range
        range:
          from: A
          to: Z
          cardinality: 2-3
  country_or_area: Algeria
- groups:
    amateur:
    - regex: "(AY|AZ|LU|LW)[:digit:][:province:][A-Z]"
      criteria:
      - key: '1'
        segment_type: enum
        values:
        - segment_type: string
          value: AY
        - segment_type: string
          value: AZ
        - segment_type: string
          value: LU
        - segment_type: string
          value: LW
      - key: '2'
        segment_type: range
        range:
          from: '0'
          to: '9'
      - key: '3'
        segment_type: codelist
        codelist: province
      - key: '4'
        segment_type: range
        range:
          from: A
          to: Z
  codelists:
  - name: province
    list:
    - name: Federal Capital
      code:
        from: A
        to: C
    - name: Province of Buenos Aires
      code:
        from: D
        to: E
    - name: Province of Santa Fé
      code: F
    - name: Province of Chaco
      code:
        from: GA
        to: GO
    - name: Province of Formosa
      code:
        from: GP
        to: GZ
    - name: Province of Córdoba
      code: H
    - name: Province of Misiones
      code: I
    - name: Province of Entre Ríos
      code: J
    - name: Province of Tucumán
      code: K
    - name: Province of Corrientes
      code: L
    - name: Province of Mendoza
      code: M
    - name: Province of Santiago del Estero
      code: "N"
    - name: Province of Salta
      code: O
    - name: Province of San Juan
      code: P
    - name: Province of San Luis
      code: Q
    - name: Province of Catamarca
      code: R
    - name: Province of La Rioja
      code: S
    - name: Province of Jujuy
      code: T
    - name: Province of La Pampa
      code: U
    - name: Province of Rio Negro
      code: V
    - name: Province of Chubut
      code: W
    - name: Province of Santa Cruz
      code:
        from: XA
        to: XO
    - name: Province of Tierra del Fuego, Antarctic and Islands of South Atlantic
      code:
        from: XP
        to: XZ
    - name: Neuquén
      code: "Y"
    - name: Antarctic
      code: Z
  country_or_area: Argentina
- groups:
    amateur:
    - name: Amateur stations
      regex: P4[39][A-Z]{2,3}
      criteria:
      - segment_type: string
        key: '1'
        value: P4
      - segment_type: enum
        key: '2'
        values:
        - segment_type: string
          value: '3'
        - segment_type: string
          value: '9'
      - segment_type: range
        key: '3'
        range:
          from: A
          to: Z
          cardinality: 2-3
    - name: Special events (see Note 2)
      regex: P4[01][A-Z]{1,3}
      criteria:
      - segment_type: string
        key: '1'
        value: P4
      - segment_type: enum
        key: '2'
        values:
        - segment_type: string
          value: '0'
        - segment_type: string
          value: '1'
      - segment_type: range
        key: '3'
        range:
          from: A
          to: Z
          cardinality: 1-3
  notes:
  - i)  Foreign amateurs will use the call sign assigned to them by their administration
    followed by a stroke (/) and then P4 for a duration of one year.
  - ii)  The prefix P40 or P41 followed by a group of not more than 3 letters is assigned
    during special events for not more than one month.
  country_or_area: Aruba
- groups:
    amateur:
    - name: Advanced license
      regex: "(VK|AX|VI)[:amateur_area:][A-GI-KS-UW-Z][A-Z]{2,3}"
      criteria:
      - segment_type: enum
        key: '1'
        values:
        - segment_type: string
          value: VK
        - segment_type: string
          value: AX
        - segment_type: string
          value: VI
      - segment_type: codelist
        key: '2'
        codelist: amateur_area
      - segment_type: enum
        key: '3'
        values:
        - segment_type: range
          range:
            from: A
            to: G
        - segment_type: range
          range:
            from: I
            to: K
        - segment_type: range
          range:
            from: S
            to: U
        - segment_type: range
          range:
            from: W
            to: Z
      - segment_type: range
        key: '4'
        range:
          from: A
          to: Z
          cardinality: 2-3
    - name: Standard license
      regex: "(VK|AX|VI)[:amateur_area:][HLMNPV][A-Z]{2}"
      criteria:
      - segment_type: enum
        key: '1'
        values:
        - segment_type: string
          value: VK
        - segment_type: string
          value: AX
        - segment_type: string
          value: VI
      - segment_type: codelist
        key: '2'
        codelist: amateur_area
      - segment_type: enum
        key: '3'
        values:
        - segment_type: string
          value: H
        - segment_type: string
          value: L
        - segment_type: string
          value: M
        - segment_type: string
          value: P
        - segment_type: string
          value: V
      - segment_type: range
        key: '4'
        range:
          from: A
          to: Z
          cardinality: '2'
    - name: Foundation license
      regex: "(VK|AX|VI)[:amateur_area:][F][A-Z]{3}"
      criteria:
      - segment_type: enum
        key: '1'
        values:
        - segment_type: string
          value: VK
        - segment_type: string
          value: AX
        - segment_type: string
          value: VI
      - segment_type: codelist
        key: '2'
        codelist: amateur_area
      - segment_type: string
        key: '3'
        value: F
      - segment_type: range
        key: '4'
        range:
          from: A
          to: Z
          cardinality: '3'
    experimental:
    - regex: AX[:digit:][:experimental_area:][:upper:]{2}
      criteria:
      - segment_type: string
        key: '1'
        value: AX
      - key: '2'
        segment_type: range
        range:
          from: '0'
          to: '9'
      - key: '3'
        segment_type: codelist
        codelist: experimental_area
      - key: '4'
        segment_type: range
        range:
          from: A
          to: Z
          cardinality: '2'
  codelists:
  - name: amateur_area
    list:
    - code: '1'
      name: Australian Capital Territory
    - code: '2'
      name: New South Wales
    - code: '3'
      name: Victoria
    - code: '4'
      name: Queensland
    - code: '5'
      name: South Australia
    - code: '6'
      name: Western Australia
    - code: '7'
      name: Tasmania
    - code: '8'
      name: Northern Territory
    - code: '9'
      name: Australian External Territories
  - name: experimental_area
    list:
    - code: A
      name: Australian Capital Territory
    - code: "N"
      name: New South Wales
    - code: V
      name: Victoria
    - code: Q
      name: Queensland
    - code: S
      name: South Australia
    - code: W
      name: Western Australia
    - code: T
      name: Tasmania
    - code: D
      name: Northern Territory
  country_or_area: Australia
- groups:
    amateur:
    - regex: OE[:amateur_area:][:upper:]{2,3}
      criteria:
      - segment_type: string
        key: '1'
        value: OE
      - key: '2'
        segment_type: codelist
        codelist: amateur_area
      - key: '3'
        segment_type: range
        range:
          from: A
          to: Z
          cardinality: 2-3
    experimental:
    - regex: OE[:experimental_area:]Q[:upper:]
      criteria:
      - segment_type: string
        key: '1'
        value: OE
      - key: '2'
        segment_type: codelist
        codelist: experimental_area
      - segment_type: string
        key: '3'
        value: Q
      - key: '4'
        segment_type: range
        range:
          from: A
          to: Z
          cardinality: '1'
  codelists:
  - name: amateur_area
    list:
    - code: '1'
      name: Vienna (amateur stations only)
    - code: '2'
      name: Salzburg
    - code: '3'
      name: Vienna (experimental stations only) and Lower Austria
    - code: '4'
      name: Burgenland
    - code: '5'
      name: Upper Austria
    - code: '6'
      name: Styria
    - code: '7'
      name: Tyrol
    - code: '8'
      name: Carinthia
    - code: '9'
      name: Vorarlberg
    - code: '0'
      name: extraterritorial (on board ships or on board aircraft)
  - name: experimental_area
    list:
    - code: '2'
      name: Salzburg
    - code: '3'
      name: Vienna (experimental stations only) and Lower Austria
    - code: '4'
      name: Burgenland
    - code: '5'
      name: Upper Austria
    - code: '6'
      name: Styria
    - code: '7'
      name: Tyrol
    - code: '8'
      name: Carinthia
    - code: '9'
      name: Vorarlberg
  country_or_area: Austria
- groups:
    amateur: &1
    - regex: C6[2-9][:upper:]{2}
