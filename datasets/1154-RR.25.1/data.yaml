- groups:
    amateur:
    - name: Amateur stations
      regex: H[JK][:zone:][:upper:]{1,3}
      criteria:
      - segment_type: string
        key: '1'
        value: H
      - segment_type: enum
        key: '2'
        values:
        - segment_type: string
          value: J
        - segment_type: string
          value: K
      - segment_type: codelist
        key: '3'
        codelist: zone
      - segment_type: range
        key: '4'
        range:
          from: A
          to: Z
          cardinality: 1-3
    - name: Amateur stations operating during contests or special events
      regex: 5[JK][:zone:][:upper:]{1,3}
      criteria:
      - segment_type: string
        key: '1'
        value: '5'
      - segment_type: enum
        key: '2'
        values:
        - segment_type: string
          value: J
        - segment_type: string
          value: K
      - segment_type: codelist
        key: '3'
        codelist: zone
      - segment_type: range
        key: '4'
        range:
          from: A
          to: Z
          cardinality: 1-3
