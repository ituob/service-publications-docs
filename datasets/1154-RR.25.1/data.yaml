      - segment_type: string
        key: '1'
        value: C6
      - key: '2'
        segment_type: range
        range:
          from: '2'
          to: '9'
      - key: '3'
        segment_type: range
        range:
          from: A
          to: Z
          cardinality: '2'
    experimental: *1
  country_or_area: Bahamas
- groups:
    amateur:
    - regex: A9[:digit:][0-9A-Z]{2,4}
      criteria:
      - segment_type: string
        key: '1'
        value: A9
      - key: '2'
        segment_type: range
        range:
          from: '0'
          to: '9'
      - key: '3'
        segment_type: enum
        values:
        - segment_type: range
          range:
            from: '0'
            to: '9'
        - segment_type: range
          range:
            from: A
            to: Z
        - segment_type: range
          range:
            cardinality: 2-4
  country_or_area: Bahrain
- groups:
    amateur:
    - name: National radio amateurs
      regex: 8P6[:upper:]{2}
      criteria:
      - segment_type: string
        key: '1'
        value: 8P6
      - segment_type: range
        key: '2'
        range:
          from: A
          to: Z
          cardinality: '2'
    - name: Foreign radio amateurs, visitors and short-term licence holders.
      regex: 8P9[:upper:]{2}
      criteria:
      - segment_type: string
        key: '1'
        value: 8P6
      - segment_type: range
        key: '2'
        range:
          from: A
          to: Z
          cardinality: '2'
  country_or_area: Barbedos
- groups:
    amateur:
    - name: class A (operator with CEPT licence, HAREC certificate)
      regex: E[UVW][:city_region:][:upper:]{1}
    - name: Class A and class B (operator with CEPT licence, HAREC certificate)
      regex: E[UVW][:city_region:][:upper:]{2}
    - name: Class C (operator with novice licence, ARNEC certificate)
      regex: E[UVW][:city_region:][:upper:]{3}
    - name: Club stations
      regex: E[UVW][:city_region:](W|X|Z)[:upper:]{1}
    - name: Foreign radio amateurs
      regex: EW/.*
    experimental:
    - name: repeaters
      regex: EU[1-4|6-8][:digit:]{2}R
    - name: radiobeacons
      regex: EU[1-4|6-8][:digit:]{2}B
    - name: satellites
      regex: EU[1-8][:digit:]S
    - name: stations operating in radio contests
      regex: EV[:digit:][:upper:]{2}
    - name: expeditions to space-based facilities
      regex: EV[1-8][:digit:]ISS
    - name: stations operating in the Antartic
      regex: EV0AN[:upper:]
    - name: stations operating on days of special national and international events
      regex: EV[:digit:]{1-4}[:upper:]
    - name: participants in international SW and USW radio communication competitions
        (up to one year)
      regex: E[UVW]5[:upper:]
  codelists:
  - name: city_region
    list:
    - code: '1'
      name: City of Minsk
    - code: '2'
      name: Minsk Region
    - code: '3'
      name: Brest Region
    - code: '4'
      name: Grodno Region
    - code: '5'
      name: Vitebsk Region
    - code: '6'
      name: Mogilev Region
    - code: '7'
      name: Gomel Region
  notes:
  - Foreign radio amateurs with a licence must use EW followed by slash (/) and their
    own call sign.
  country_or_area: Belarus
