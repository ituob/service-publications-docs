    their webpage concerning the national numbering plan as well as their contact
    points, so that the information, which will be made available freely to all administrations/ROAs
    and service providers, can be posted on the ITU-T website. For their numbering
    website, or when sending their information to ITU/TSB (e-mail: tsbtson@itu.int
