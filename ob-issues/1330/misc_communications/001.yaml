        text: 'Communication of 19.XI.2025:'
    - type: paragraph
      content:
      - type: text
        text: 'On the occasion of the "IARU Region 1 Young Radio Operators Month",
          the Serbian Administration authorizes radio stations of the Amateur Radio
          Union of Serbia to use the special call signs '
      - type: text
        marks:
        - type: strong
        text: 'YT25YOTA '
      - type: text
        text: 'and '
      - type: text
        marks:
        - type: strong
        text: YU25YOTA
      - type: text
        text: " from 1 to 31 December 2025."
