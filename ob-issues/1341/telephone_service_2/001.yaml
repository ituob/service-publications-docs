              code ranges in accordance with the national legislation of the Parties;
        - type: paragraph
          content:
          - type: text
            text: 2)          make use of numbering in the specified numbering code
              ranges exclusively in their respective national telephone networks.
        - type: paragraph
          content:
          - type: text
            text: "** Unassigned code resources (26 codes: 819, 822-829, 830, 832,
              837-839, 849, 852-854, 858-859, 864, 868, 870, 874-876) are retained
              in the common reserve. Withdrawal from the reserve and the subsequent
              reassignment of the unassigned code resources shall be conducted by
              mutual consent of the Parties and formalized by separate protocols to
              the Agreement between the Government of the Republic of Kazakhstan and
              the Government of the Russian Federation on the joint use of numbering
              for world numbering zone 7, which shall become integral parts of this
              Agreement."
