      - type: text
        text: 'Communication of 24.IV.2026:'
    - type: paragraph
      content:
      - type: text
        text: 'On the occasion of the International Sava River Day (1 June), the Serbian
          Administration authorizes radio stations of the Amateur Radio Club "Nikol
          Tesla" Sabac to use the special call sign '
      - type: text
        marks:
        - type: strong
        text: YT1SAVA
      - type: text
        text: " from 1 to 7 June 2026."
    - type: paragraph
      content:
      - type: text
        marks:
        - type: strong
        text: Austria
    - type: paragraph
      content:
      - type: text
        text: 'Communication of 8.V.2026:'
    - type: paragraph
      content:
      - type: text
        text: 'On the occasion of the "Internationales IARU-Jugendcamp in Wagrain",
          the Austrian Administration authorizes an Austrian amateur station to use
          the special call sign '
      - type: text
        marks:
        - type: strong
        text: 'OE2YOTA '
      - type: text
        text: from 25 to 31 July 2026.
