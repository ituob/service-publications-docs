  - PART II
  - PARTICULARS OF MONITORING STATIONS CARRYING OUT MEASUREMENTS RELATED TO STATIONS
    OF TERRESTRIAL RADIOCOMMUNICATION SERVICES
  - 1) 7 éléments d'antenne actifs de type dipôle volumétrique d'une hauteur de 7,5
    m pour la réception et le repérage des ondes électro­magné­tiques avec polari­sation
    verticale dans la gamme de fréquences de 100 kHz à 30 MHz. — 1) 7 active antenna
    elements of type volume vibrator of height 7.5 m for reception and direction-finding
    of electromagnetic waves with vertical polarization in the frequency band from
    100 kHz to 30 MHz. — 1) 7 elementos de antena activos de tipo vibrador de volumen
    de 7,5 m de altura para la recepción y radio­go­niometría de ondas electromag­néticas
    con polarización vertical en la banda de frecuencias de 100 kHz a 30 MHz.
  - 2) Système d'antenne, gamme de fré­quences de 10 kHz à 100 kHz – deux antennes
    doublet magnétiques – cadres à plusieurs spires avec noyaux en ferrite, longueur
    active de l'antenne supé­rieure à 0,5 m. Polari­sation verticale. — 2) Antenna
    system with frequency range from 10 kHz to 100 kHz – two magnetic dipoles – multiturn
    frames with ferrite cores, active length of an­ten­na not less than 0.5 m. Vertical
    polarization. — 2) Sistema de antenas con una gama de frecuencias de 10 kHz a
    100 kHz – dos dipolos magnéticos – cuadros multi­­espiras con núcleos de ferrita,
    lon­gitud activa de la antena no inferior a 0,5 m. Polarización vertical.
  - 3) Système d'antenne, gamme de fré­quences de 100 kHz à 1 MHz – deux antennes
    doublet magnétiques – cadres à trois spires d'un diamètre de 3 m, longueur active
    de l'antenne supérieure à 1,5 m. Polarisation verticale. — 3) Antenna system with
    frequency range from 100 kHz to 1 MHz –two magnetic dipoles – three-turn frames
    with diameter 3 m, active length of antenna not less than 1.5 m. Vertical polarization.
    — 3) Sistema de antenas con gama de fre­cuencias de 100 kHz a 1 MHz – dos dipolos
    magnéticos – cuadros con espiras de tres vueltas y un diámetro de 3 m, longitud
    activa de la antena no inferior a 1,5 m. Polarización vertical.
  - 4) Système d'antenne, gamme de fré­quences de 1 MHz à 30 MHz –17 antennes sur
    la base de dipôles volumé­triques asymétriques verticaux d'une hauteur de 11,93
    m. Polari­sation verticale. — 4) Antenna system with frequency range from 1 MHz
    to 30 MHz – 17 antennas based on vertical asym­metrical volumetric dipoles with
    a height of 11.93 m. Vertical polari­zation. — 4) Sistema de antenas con gama
    de fre­cuencias de 1 MHz a 30 MHz – 17 antenas basadas en dipolos volu­métricos
    asimétricos verticales con una altura de 11,93 m. Polari­zación vertical.
  - 5) Système d'antenne-cadre à trois canaux sur mât, gamme de fréquences de 100
    kHz à 1 MHz, longueur active de l'antenne supé­rieure à 1,5 m, réception et repérage
    des ondes électromagnétiques, pola­ri­sation verticale. — 5) Three-channel loop
    antenna system in the frequency band from 100 kHz to 1 MHz on a mast, operating
    antenna length not less than 1.5 m, for reception and direction-finding of electromagnetic
    waves with vertical polarization — 5) Sistema de antenas de cuadro de tres canales
    en la banda de frecuencias de 100 kHz a 1 MHz en un mástil con una longitud de
    antena no inferior a 1,5 m para la recepción y radiogo­niometría de ondas electro­mag­néticas
    con polarización vertical.
  - 6) 8 éléments d'antenne actifs de type dipôle volumétrique d'une hauteur de 7,5
    m pour la réception et le repérage des ondes électromagné­tiques avec polarisation
    verticale dans la gamme de fréquences de 100 kHz à 30 MHz. — 6) 8 active antenna
    elements of type volume vibrator of height 7.5 m for reception and direction-finding
    of electro­magnetic waves with vertical polarization in the frequency band from
    100 kHz to 30 MHz. — 6) 8 elementos de antena activos de tipo vibrador de volumen
    de 7,5 m de altura para la recepción y radiogo­niometría de ondas electro­magné­ticas
    con polarización vertical en la banda de frecuencias de 100 kHz a 30 MHz.
  - 7) Dispositif d'antenne-cadre magné­tique à trois canaux, gamme de fré­quences
    de 10 kHz à 100 kHz, dans un conteneur transparent aux ondes radioélectriques,
    longueur active de l'antenne supérieure à 0,5 m. Polari­sation verticale. — 7)
    Three-channel magnetic loop antenna arrangement, range from 10 kHz to 100 kHz,
    in a radio­transparent con­tainer, active length of antenna not less than 0.5
    m. Vertical polarization. — 7) Disposición de antena de bucle mag­nética de tres
    canales, gama de 10 kHz a 100 kHz, en un contenedor radio­transparente, longitud
    activa de la antena no inferior a 0,5 m. Polari­zación vertical.
  - 8) Relèvement par phase. — 8) Direction-finding mode – phased. — 8) Modo radiogoniometría
    en fase.
  - 9) Dispositif d'antenne-cadre à trois canaux sur mât, gamme de fré­quences de
    100 kHz à 1 MHz, lon­gueur active de l'antenne supé­rieure à 1,5 m. Polarisation
    verticale. — 9) Mast-supported three-channel loop antenna arrangement, range from
    100 kHz to 1 MHz, active length of antenna not less than 1.5 m. Vertical polarization.
    — 9) Disposición de antena de bucle de tres canales soportada por mástil, gama
    de 100 kHz a 1 MHz, longitud activa de la antena no inferior a 1,5 m. Pola­rización
    vertical.
  - 10) 16 éléments d'antenne actifs de type dipôle volumétrique d'une hauteur de
    11,93 m. Polarisation verticale. — 10) 16 active antenna elements of the volumetric
    dipole type, height 11.93 m. Vertical polarization. — 10) 16 elementos de antena
    activos de tipo dipolo volumétrico, altura de 11,93 m. Polarización vertical.
  - 11) Conformément à la Recommandation UIT-R SM.443-4. — 11) In accordance with
    Recommendation ITU-R SM.443-4. — 11) Confor­­me con la Recomendación UIT‑R SM.443-4.
  - 12) Contrôle automatique de l'occu­pation d'une bande de fréquences donnée depuis
    F-start jusqu'à F-stop pour une période de temps spécifiée; contrôle de l'occupation
    des canaux radioélectriques avec traitement numé­rique et enregis­trement des
    données. — 12) Automatic monitoring of occupation of given frequency band from
    F‑start to F‑stop for specified period of time; monitoring of occupation of radio­frequency
    channels with digital pro­cessing and data recording. — 12) Comprobación técnica
    automática de la ocupación de una determinada banda de frecuencias, desde la F‑inicio
    hasta la F-final, durante un periodo de tiempo específico; com­pro­bación técnica
    de la ocu­pación de canales de radio­frecuencia con trata­miento digital y registro
    de datos.
  - 13) Deux antennes doublet magné­tiques – cadres à plusieurs spires avec noyaux
    en ferrite. La longueur effective de l'antenne supé­rieure à 0,5 m. Polarisation
    verticale. — 13) Two magnetic dipoles – multiturn frames with ferrite cores. The
    effective length of antenna not less 0.5 m. Vertical polarization. — 13) Dos dipolos
    magnéticos – cuadros multi­espiras con núcleos de ferrita. La longitud efectiva
    de la antena no inferior a 0,5 m. Polarización vertical.
  - 14) Deux antennes doublet magné­tiques – cadres à trois spires d'un diamètre de
    3 m. La longueur effec­tive de l'antenne supérieure à 1,5 m. Polarisation verticale.
    — 14) Two magnetic dipoles – three-turn frames 3 m in diameter. The effec­tive
    length of antenna not less 1.5 m. Vertical polarization. — 14) Dos dipolos magnéticos
    – cuadros con espiras de tres vueltas y un diámetro de 3 m. La longitud efectiva
    de la antena no inferior a 1,5 m. Polarización vertical.
  - 15) 17 antennes sur la base de dipôles asy­métriques verticaux d'une hauteur de
    11,93 m. Polarisation verticale. — 15) 17 antennas based on vertical asym­metrical
    dipoles with 11.93 m in height. Vertical polari­zation. — 15) 17 antenas basadas
    en dipolos asi­métricos verticales con una altura de 11,93 m. Polari­zación vertical.
  - 16) Mesure automatique du degré d'occu­pa­tion du spectre selon la Recommandation
    UIT-R SM.1880 et le Manuel sur le contrôle du spectre radioélectrique de l'UIT-R.
    — 16) Automatic measurement of spec­trum occupancy in accordance with ITU-R Recommendation
    SM.1880 and ITU-R Handbook on Spectrum Monitoring. — 16) Medición automática del
    grado de ocupación del espectro según la Recomendación UIT-R SM.1880 y el Manual
    sobre comprobación técnica del espectro de la UIT-R.
