  notes:
  - Administrations are requested to notify ITU about their national numbering plan
    changes, or to give an explanation on their webpage concerning the national numbering
    plan as well as their contact points, so that the information, which will be made
    available freely to all administrations/ROAs and service providers, can be posted
    on the ITU-T website.
  - 'For their numbering website, or when sending their information to ITU/TSB (e-mail:
    tsbtson@itu.int ), administrations are kindly requested to use the format as explained
    in Recommendation ITU-T E.129. They are reminded that they will be responsible
    for the timely update of this information.'
  - 'From 15.I.2020, the following countries/geographical areas have updated their
    national numbering plan on our site:'
  - "* This designation is without prejudice to positions on status, and is in line
    with UNSCR 1244 and the ICJ Opinion on the Kosovo declaration of independence."
