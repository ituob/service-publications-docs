  - 1. Geographical coordinates
  - 35°12'24" N 139°39'03" E
  - 2. Hours of service
  - 2330-0815 h from Monday to Friday
  - 3. Information on antennas in use
  - 13 m Cassegrain antenna for frequency ranges (a), (b), (c), (d), (e).
  - 4. Range of azimuth and elevation angles
  - 180°, 90°
  - 5. Maximum attainable accuracy in determining orbital positions of space stations
  - "(a) L band: 0.030° rms (b) S band: 0.023° rms (c) C band: 0.016° rms (d) Ku band:
    0.010° rms (e) Ka band: 0.010° rms Accuracy in antenna pointing direction."
  - 6. Information on system polarization
  - 'Polarization tracking in all frequency ranges: ‒ Circular polarization (RHC,
    LHC), and ‒ Linear polarization (V, H).'
  - "(cont.)"
  - J Japan (cont.)
  - 7. System noise temperature
  - "(a) L band: 171.2 K (b) S band: 64.5 K (c) C band: 180.1 K (d) Ku band: 152.4
    K (e) Ka band: 237.4 K"
  - 8. Ranges of frequencies with the maximum attainable accuracy of frequency measurement
    for each frequency range
  - "(a) L band: 1525 MHz - 1710 MHz (b) S band: 2120 MHz - 2690 MHz (c) C band: 3400
    MHz - 4800 MHz (d) Ku band: 10.7 GHz - 12.75 GHz (e) Ka band: 17.7 GHz - 22 GHz
    Sweep method: 10% of sweep span (C/N ≥ 15 dB). Counter method: 1 × 10 –6 (C/N
    ≥ 15 dB)."
  - 9. Ranges of frequencies in which field strength or power flux-density measurements
    can be performed
  - "(a) L band: 1525 MHz - 1710 MHz (b) S band: 2120 MHz - 2690 MHz (c) C band: 3400
    MHz - 4800 MHz (d) Ku band: 10.7 GHz - 12.75 GHz (e) Ka band: 17.7 GHz - 22 GHz"
  - 10. Minimum value of measurable field strength or power flux-density with indication
    of attainable accuracy of measurement
  - "(a) L band: -157.1 dBm ~ -121.9 dBm ± 1 dB (b) S band: -165.7 dBm ~ -126.8 dBm
    ± 1 dB (c) C band: -168.2 dBm ~ -118.7 dBm ± 1 dB (d) Ku band: -172.2 dBm ~ -121.1
    dBm ± 1 dB (e) Ka band: -152.1 dBm ~ -120.4 dBm ± 1 dB"
  - 11. Information available for bandwidth measurements
  - Bandwidth measurements in accordance with the methods described in the Spectrum
    Monitoring Handbook.
  - 12. Information available for spectrum occupancy measurements
  - Time and frequency of the signal from the satellite are graphically displayed
    on the spectrum monitor terminal.
  - 13. Information available for orbit occupancy measurements
  - Automatic orbital location measurements are carried out and the transition records
    of orbital locations are graphically displayed on the monitor terminal.
