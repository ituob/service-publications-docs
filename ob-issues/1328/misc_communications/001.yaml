        text: 'Communication of 29.X.2025:'
    - type: paragraph
      content:
      - type: text
        text: 'On the occasion of the event "45 Years with Us", organized by the Amateur
          Radio Club in Pancevo, the Serbian Administration authorizes radio stations
          of the Amateur Radio Club "Mihajlo Pupin" to use the special call sign '
      - type: text
        marks:
        - type: strong
        text: YU45MJA
      - type: text
        text: " from January 1 to December 31, 2026."
