  - 1. Geographical coordinates
  - 105°24'24''E — 021°20'20''N
  - 2. Hours of service
  - 'H24: on request'
  - 3. Information on antennas in use
  - 6.3 m Cassegrain antenna for frequency ranges 3.4 GHz to 4.2 GHz and 10.70 GHz
    to 12.75 GHz; slew rate 0.02° to 2°/second (azimuth), 0.02° to 2°/second (elevation).
  - 4. Range of azimuth and elevation angles
  - Azimuth -120° to +120°, elevation 0° to 90°.
  - 5. Maximum attainable accuracy in determining orbital positions of space stations
  - "≤ 0.03° and in accordance with ITU-R Recommendations and the Handbook on Spectrum
    Monitoring."
  - 6. Information on system polarization
  - Linear (H, V)
  - 7. System noise temperature
  - "(a) C band: 95° K — (b) Ku band: 145° K"
  - "(cont.)"
  - 8. Ranges of frequencies with the maximum attainable accuracy of frequency measurement
    for each frequency range
  - "(a) C band: 3.4 GHz - 4.2 GHz: 1 × 10 -12 — (b) Ku Band: 10.7 GHz - 12.75 GHz:
    1 × 10 -12"
  - 9. Ranges of frequencies in which field strength or power flux-density measurements
    can be performed
  - "(a) C band: 3.4 GHz - 4.2 GHz — (b) Ku Band: 10.7 GHz - 12.75 GHz"
  - 10. Minimum value of measurable field strength or power flux-density with indication
    of attainable accuracy of measurement
  - "(a) ~ -168 dBW/m² ± 1.5 dB — (b) ~ -168 dBW/m² ± 1.5 dB — Bandwidth 4 kHz, S/N
    ≥ 10 dB"
  - 11. Information available for bandwidth measurements
  - X dB and β/2% methods, using spectrum analyser.
  - 12. Information available for spectrum occupancy measurements
  - Frequency occupancy and channel occupancy measurements.
  - 13. Information available for orbit occupancy measurements
  - GSO orbit positions can be measured.
