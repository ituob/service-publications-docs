  notes:
  - Corrigendum*
  - "* This information cancels and replaces that published in ITU Operational Bulletin
    No. 949 of 1.II.2010, page 28"
  - 1) The national and international telegram service is not accepted from and to
    Lithuania (see the communication from Regulator in this ITU Operational Bulletin
    No. 957 of 1.VI.2010, page XX). Consequently, the telegram destination indicator
    “LT” and the office code “LTXX” are deleted. The letters “LT” remain, however,
    reserved for use by Lithuania (for the telex service, ITU-T Recommendations F.68/F.69,
    and for the Maritime Mobile Service, ITU-T Recommendation D.90).
  - 1) The national and international telegram service is not accepted from and to
    Vanuatu (see the communication from Regulator in this ITU Operational Bulletin
    No. 957 of 1.VI.2010, page XX). Consequently, the telegram destination indicator
    “NH” and the office codes “NHVL, NHVX” are deleted. The letters “NH” remain, however,
    reserved for use by Vanuatu (for the telex service, ITU-T Recommendations F.68/F.69,
    and for the Maritime Mobile Service, ITU-T Recommendation D.90).
