  - 1. Geographical coordinates
  - 23°33'09"N 058°19'59"E
  - 2. Hours of service
  - Sunday – Thursday (07:30 AM – 03:00 PM) Oman time (03:30 AM – 11:00 AM) UTC
  - 3. Information on antennas in use
  - "(A1) Two 7.3 m Turning-Head Antennas for frequency range (a), (b) (A2) Two 6.2
    m Turning-Head Antennas for frequency range (c), (d) (A3) Two 3.7 m Full Motion
    Antennas for frequency range (e) (A4) One 3.7 m Full Motion Antenna for frequency
    range (f), (g), (h)"
  - 4. Range of azimuth and elevation angles
  - "(A1) AZI = 94° – 266° _ELE = 5° – 85° (A2) AZI = 94° – 266° _ELE = 5° – 85° (A3)
    AZI = 5° – 355° _ELE = 5° – 85° (A4) AZI = 5° – 355° _ELE = 5° – 85°"
  - 5. Maximum attainable accuracy in determining orbital positions of space stations
  - 0.02°
  - 6. Information on system polarization
  - Linear Polarization (Horizontal and Vertical) in frequency ranges (a), (b), (c),
    (d), (f), (g), (h). Circular Polarization (RHC and LHC) in frequency ranges (a),
    (d), (e), (f), (g)
  - 7. System noise temperature
  - 105 K for frequency range (a) 175 K for frequency range (b) 145 K for frequency
    range (c) 344 K for frequency range (d) 180 K for frequency range (e) 497 K for
    frequency range (f) 520 K for frequency range (g) 813 K for frequency range (h)
  - 8. Ranges of frequencies with the maximum attainable accuracy of frequency measurement
    for each frequency range
  - "(a) 3.4 - 4.8 GHz: 1 x 10⁻¹² (b) 10.7 - 12.75 GHz: 1 x 10⁻¹² (c) 7.25 - 7.75
    GHz: 1 x 10⁻¹² (d) 17.6 - 22 GHz: 1 x 10⁻¹² (e) 1.4 - 2.4 GHz: 1 x 10⁻¹² (f) 0.08
    - 1.3 GHz: 1 x 10⁻¹² (g) 1 - 18 GHz: 1 x 10⁻¹² (h) 18 - 40 GHz: 1 x 10⁻¹²"
  - 9. Ranges of frequencies in which field strength or power flux-density measurements
    can be performed
  - All Frequency Ranges.
  - 10. Minimum value of measurable field strength or power flux-density with indication
    of attainable accuracy of measurement
  - "-190 dBW/m² with ± 1.5 dB at 4 kHz BW."
  - 11. Information available for bandwidth measurements
  - Bandwidth measurements in accordance with the methods described in the Spectrum
    Monitoring Handbook.
  - 12. Information available for spectrum occupancy measurements
  - Automatic and Manual spectrum occupancy measurements are carried out in all frequency
    ranges.
  - 13. Information available for orbit occupancy measurements
  - Automatic and Manual orbit occupancy measurements are carried out in all frequency
    ranges.
