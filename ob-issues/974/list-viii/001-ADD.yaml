  - Spectrum occupancy measurements can be done using subsystem for spectrum monitoring
    in the C and Ku bands . Measurement results can be presented as spectrogram or
    waterfall diagram. As well measurement results are automatically stored in distributed
    database.
  - Radio monitoring system is able to check given orbit occupancy if satellite frequency
    plan is known. Measurement results can be presented as spectrograms. Semiautomatic
    frequency monitoring of given satellites can be done on request.
