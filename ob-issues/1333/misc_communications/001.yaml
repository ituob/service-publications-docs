        text: 'Communication of 5.I.2026:'
    - type: paragraph
      content:
      - type: text
        text: 'On the occasion of the 170th anniversary of Nikola Tesla’s birth, the
          Serbian Administration authorizes radio stations of the Amateur Radio Union
          of Serbia to use the special call sign '
      - type: text
        marks:
        - type: strong
        text: YT170TESLA
      - type: text
        text: " from 1 to 31 December 2026."
