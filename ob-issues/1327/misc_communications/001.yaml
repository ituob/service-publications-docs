      - type: text
        text: 'Communication of 18.IX.2025:'
    - type: paragraph
      content:
      - type: text
        text: 'On the occasion of the jubilee of the foundation of the first amateur
          radio club in Odzaci, the Serbian Administration authorizes radio stations
          of the Amateur Radio Club "Neutrino" to use the special call sign '
      - type: text
        marks:
        - type: strong
        text: YU65AEC
      - type: text
        text: " from January 1 to December 31, 2026."
