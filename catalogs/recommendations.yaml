# Canonical catalog of ITU-T Recommendations that create OB registers.
#
# Single source of truth consumed by:
#   - ituob/lib/ituob/catalogs/recommendations.rb (Ruby)
#   - ituob.org-v2/src/lib/catalogs.ts (TypeScript/Astro)
#
# Each entry is a Recommendation. One Recommendation may create multiple
# Registers — see registers.yaml for the per-register definitions.

recommendations:
