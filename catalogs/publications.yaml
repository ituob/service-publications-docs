# DEPRECATED: This file is superseded by catalogs/registers.yaml and
# catalogs/recommendations.yaml. The Ituob::Catalogs::Publications module
# now delegates to Registers internally. This file is retained for
# backwards compatibility only — do NOT add new entries here. Add
# registers to registers.yaml and recommendations to recommendations.yaml.
#
# Original description below:
# Canonical catalog of OB publications (datasets and external lists).
#
# This is the SINGLE SOURCE OF TRUTH consumed by:
#   - ituob/lib/ituob/catalogs/publications.rb (Ruby)
#   - ituob.org-v2/src/lib/catalogs.ts (TypeScript/Astro)
#
# Adding a new publication = appending one entry below. No other module
# needs to change.
#
# Fields:
#   publication_id   — the string used in source YAML target.publication
#   slug             — filesystem-safe directory name
#   classification   — "structured" (per-entry shape) or "textual" (freeform)
#   parser_class     — Ruby class name that parses this publication's
#                      amendments. Omit for textual publications.
#   renderer         — Astro renderer component name (see
#                      ituob.org-v2/src/components/renderers/). Omit to use
#                      the default (structured-amendment or text-amendment).
#   recommendation   — ITU-T Recommendation code (e.g. "E.118").
#   issue_introduced  — OB issue number where this dataset was first annexed.
#   external         — true for external publications not annexed to OB
#                      (NNP, List V, List VIII, Coast Stations).
---
publications:
  # --- Structured datasets with per-dataset parsers ---
  - publication_id: E118_IIN
    slug: e118-iin
    classification: structured
    parser_class: Ituob::Models::E118Amendment
    renderer: iin-table
    recommendation: E.118
    issue_introduced: 1161

