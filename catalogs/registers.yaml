# Canonical catalog of OB Registers.
#
# A Register is a named dataset mandated by exactly one ITU-T
# Recommendation (see recommendations.yaml). One Recommendation can
# create multiple Registers.
#
# Single source of truth consumed by:
#   - ituob/lib/ituob/catalogs/registers.rb (Ruby)
#   - ituob.org-v2/src/lib/catalogs.ts (TypeScript/Astro)
#
# Adding a new register = appending one entry below. No other module
# needs to change.

registers:
  # === E.118 ===
  - register_id: E118_IIN
    slug: e118-iin
    recommendation: E.118
    title: { en: List of Issuer Identifier Numbers for the International Telecommunication Charge Card }
    key_field: issue_id_number
    classification: structured
    parser_class: Ituob::Models::E118Amendment
    renderer: iin-table
    seed_issue: 1161
    # ob-issues/1161/annexes.yaml:2 position_on matches meta.yaml:2 (2018-12-01).
    seed_includes_seed_issue: true
    seed_path: datasets/1161-E.118

  # === E.164 ===
  - register_id: DP
    slug: dp
    recommendation: E.164
    title:
      en: Dialling Procedures (International prefix, national (trunk) prefix and national (significant) number)
    key_field: country_code
    classification: structured
    parser_class: Ituob::Models::DPAmendment
    renderer: dp-table
    seed_issue: 994
    seed_path: datasets/994-E.164C
    # ob-issues/994/annexes.yaml:2 position_on matches meta.yaml:2 (2011-12-15).
    seed_includes_seed_issue: true

  - register_id: E164_ACN
    slug: e164-acn
    recommendation: E.164
    title: { en: List of Access codes/numbers for mobile networks }
    key_field: country_code
    classification: structured
    parser_class: Ituob::Models::E164ACNAmendment
    renderer: acn-table
    seed_issue: 1015
    seed_path: datasets/1015-E.164B
    # ob-issues/1015/annexes.yaml:2 position_on matches meta.yaml:2 (2012-11-01).
    seed_includes_seed_issue: true

  - register_id: E164_CC
    slug: e164-cc
    recommendation: E.164
    title: { en: List of Recommendation ITU-T E.164 Assigned Country Codes }
    key_field: country_code
    fallback_key_fields: [cc_ic]
    classification: structured
    parser_class: Ituob::Models::E164CCAmendment
    renderer: cc-table
    seed_issue: 1114
    seed_path: datasets/1114-E.164D
    # ob-issues/1114/annexes.yaml:2 position_on matches meta.yaml:2 (2016-12-15).
    seed_includes_seed_issue: true

  # The E.164 notes lists are printed inside the E164_CC amendments;
  # rows route to a note register by code prefix.
  - register_id: E164_NOTE_N
    slug: e164-note-n
    recommendation: E.164
    title: { en: List of Rec. ITU-T E.164 Note N codes }
    key_field: cc_ic
    classification: structured
    parser_class: Ituob::Models::E164CCAmendment
    seed_issue: 1114
    seed_path: datasets/1114-E.164D-Note-N
    source_slug: e164-cc
    route: { field: cc_ic, prefix: '+881' }

  - register_id: E164_NOTE_O
    slug: e164-note-o
    recommendation: E.164
    title: { en: List of Rec. ITU-T E.164 Note O codes }
    key_field: cc_ic
    classification: structured
    parser_class: Ituob::Models::E164CCAmendment
    seed_issue: 1114
    seed_path: datasets/1114-E.164D-Note-O
    source_slug: e164-cc
    route: { field: cc_ic, prefix: '+882' }

  - register_id: E164_NOTE_PQ
    slug: e164-note-pq
    recommendation: E.164
    title: { en: List of Rec. ITU-T E.164 Notes P and Q codes }
    key_field: cc_ic
    classification: structured
    parser_class: Ituob::Models::E164CCAmendment
    seed_issue: 1114
    seed_path: datasets/1114-E.164D-Note-PQ
    source_slug: e164-cc
    route: { field: cc_ic, prefix: '+883' }

  - register_id: NNP
    slug: nnp
    recommendation: E.129
    title: { en: National Numbering Plan }
    key_field: country_or_area
    classification: textual
    renderer: nnp-text
    external: true

  # === E.212 ===
